---
namespace: cosmonautical
name: nomadintosh
authors:
  - Violet Caulfield
version: 6.0.1
readme: README.md
description: An Ansible collection for deploying Nomad + Consul on a macOS cluster.
license:
  - GPL-3.0-only
tags:
  - nomad
  - consul
  - macos
  - homelab
  - hashicorp
  - infrastructure
repository: https://github.com/Cosmonautical-Cloud/Nomadintosh
homepage: https://github.com/Cosmonautical-Cloud/Nomadintosh
issues: https://github.com/Cosmonautical-Cloud/Nomadintosh/issues
dependencies:
  geerlingguy.mac: "*"
  community.general: "*"
  cosmonautical.notify: ">=0.0.1"
  cosmonautical.macible: ">=0.2.1"
# Never ship a local inventory (it can hold credentials) or the local
# collection cache. CI builds from a clean checkout, but a local build
# would otherwise include inventory/hosts.yml.
build_ignore:
  - .ansible
  - inventory/hosts.yml
