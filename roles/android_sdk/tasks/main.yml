---
- name: Install JDK for sdkmanager
  community.general.homebrew:
    name: "{{ android_sdk_jdk_formula }}"
    state: latest

- name: Check JDK home
  ansible.builtin.stat:
    path: "{{ android_sdk_java_home }}/bin/java"
  register: android_sdk_java

- name: Assert JDK home exists
  ansible.builtin.assert:
    that: android_sdk_java.stat.exists
    fail_msg: >-
      {{ android_sdk_java_home }}/bin/java doesn't exist after installing
      {{ android_sdk_jdk_formula }} - set android_sdk_java_home to where the
      formula actually puts its JDK.

- name: Include SDK tasks
  ansible.builtin.include_tasks: sdk.yml
