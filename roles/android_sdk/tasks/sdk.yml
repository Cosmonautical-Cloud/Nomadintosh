---
- name: Create Android SDK root
  ansible.builtin.file:
    path: "{{ android_sdk_root }}"
    state: directory
    mode: '0755'

- name: Check for sdkmanager
  ansible.builtin.stat:
    path: "{{ android_sdk_sdkmanager }}"
  register: android_sdk_sdkmanager_stat

# A fresh SDK root has no sdkmanager to install cmdline-tools;latest with, so
# unpack Google's standalone archive once and let it install the real copy.
- name: Bootstrap Android cmdline-tools
  when: not android_sdk_sdkmanager_stat.stat.exists
  block:
    - name: Create bootstrap cmdline-tools directory
      ansible.builtin.file:
        path: "{{ android_sdk_root }}/.cmdline-tools-bootstrap"
        state: directory
        mode: '0755'

    - name: Unpack bootstrap cmdline-tools
      ansible.builtin.unarchive:
        src: "{{ android_sdk_cmdline_tools_bootstrap_url }}"
        dest: "{{ android_sdk_root }}/.cmdline-tools-bootstrap"
        remote_src: true

    - name: Install cmdline-tools;latest with the bootstrap sdkmanager
      ansible.builtin.shell:
        cmd: >-
          yes | {{ android_sdk_root }}/.cmdline-tools-bootstrap/cmdline-tools/bin/sdkmanager
          --sdk_root={{ android_sdk_root }} 'cmdline-tools;latest'
      environment:
        JAVA_HOME: "{{ android_sdk_java_home }}"
      changed_when: true

  always:
    - name: Remove bootstrap cmdline-tools
      ansible.builtin.file:
        path: "{{ android_sdk_root }}/.cmdline-tools-bootstrap"
        state: absent

# sdkmanager --licenses re-prompts only for licenses not yet accepted; with
# nothing left it prints "All SDK package licenses accepted."
- name: Accept Android SDK licenses
  ansible.builtin.shell:
    cmd: "set -o pipefail; yes | {{ android_sdk_sdkmanager }} --sdk_root={{ android_sdk_root }} --licenses"
    executable: /bin/bash
  environment:
    JAVA_HOME: "{{ android_sdk_java_home }}"
  register: android_sdk_licenses
  changed_when: "'All SDK package licenses accepted' not in android_sdk_licenses.stdout"
  # yes exits 141 (SIGPIPE) once sdkmanager stops reading.
  failed_when: android_sdk_licenses.rc not in [0, 141]

# --list_installed rows look like "  platform-tools | 36.0.0 | ... | platform-tools".
- name: List installed Android SDK packages
  ansible.builtin.command:
    argv:
      - "{{ android_sdk_sdkmanager }}"
      - "--sdk_root={{ android_sdk_root }}"
      - --list_installed
  environment:
    JAVA_HOME: "{{ android_sdk_java_home }}"
  register: android_sdk_installed
  changed_when: false
  check_mode: false

- name: Install missing Android SDK packages
  ansible.builtin.command:
    argv: >-
      {{ [android_sdk_sdkmanager, '--sdk_root=' ~ android_sdk_root, '--install']
         + android_sdk_missing }}
  environment:
    JAVA_HOME: "{{ android_sdk_java_home }}"
  vars:
    android_sdk_installed_paths: >-
      {{ android_sdk_installed.stdout_lines
         | select('search', '\|')
         | map('split', '|') | map('first') | map('trim')
         | reject('in', ['Path', '-------'])
         | list }}
    android_sdk_missing: >-
      {{ android_sdk_packages
         | reject('in', android_sdk_installed_paths)
         | list }}
  when: android_sdk_missing | length > 0
  changed_when: true
