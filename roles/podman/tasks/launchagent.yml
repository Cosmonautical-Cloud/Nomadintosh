---
- name: Apply Launch Agent for Podman
  ansible.builtin.template:
    src: LaunchAgents/com.podman.machine.default.plist.j2
    dest: "{{ launch_agents_dir }}/{{ podman_launchagent_label }}.plist"
    mode: '0644'
    owner: "{{ ansible_user }}"
    group: staff

- name: Check if Podman Launch Agent is already loaded
  ansible.builtin.command:
    argv:
      - launchctl
      - list
      - "{{ podman_launchagent_label }}"
  register: podman_launchctl
  failed_when: false
  changed_when: false

- name: Load Podman Launch Agent
  when: podman_launchctl.rc != 0
  ansible.builtin.command:
    argv:
      - launchctl
      - bootstrap
      - gui/{{ ansible_user_uid }}
      - "{{ launch_agents_dir }}/{{ podman_launchagent_label }}.plist"
  changed_when: true
