---
- name: Check whether Podman is installed
  ansible.builtin.stat:
    path: "{{ homebrew_dir }}/bin/podman"
  register: podman_binary

- name: Stop and remove any existing Podman machine
  when: podman_binary.stat.exists
  block:
    - name: Check for an existing Podman machine
      ansible.builtin.command:
        argv:
          - "{{ homebrew_dir }}/bin/podman"
          - machine
          - list
          - -q
      register: podman_machine_list
      changed_when: false
      check_mode: false

    - name: Stop and remove the Podman machine
      when: podman_machine_list.stdout | trim != ""
      block:
        - name: Stop the Podman machine
          ansible.builtin.command:
            argv:
              - "{{ homebrew_dir }}/bin/podman"
              - machine
              - stop
              - "{{ podman_machine_name }}"
          failed_when: false
          changed_when: true

        - name: Remove the Podman machine
          ansible.builtin.command:
            argv:
              - "{{ homebrew_dir }}/bin/podman"
              - machine
              - rm
              - -f
              - "{{ podman_machine_name }}"
          changed_when: true

- name: Check whether Podman's LaunchAgent is loaded
  ansible.builtin.command:
    argv:
      - launchctl
      - list
      - "{{ podman_launchagent_label }}"
  register: podman_launchctl
  failed_when: false
  changed_when: false
  check_mode: false

- name: Unload Podman's LaunchAgent
  ansible.builtin.command:
    argv:
      - launchctl
      - bootout
      - "gui/{{ ansible_user_uid }}/{{ podman_launchagent_label }}"
  when: podman_launchctl.rc == 0
  changed_when: true

- name: Remove Podman's LaunchAgent plist
  ansible.builtin.file:
    path: "{{ launch_agents_dir }}/{{ podman_launchagent_label }}.plist"
    state: absent

- name: Uninstall Podman via Homebrew
  community.general.homebrew:
    name: podman
    state: absent
