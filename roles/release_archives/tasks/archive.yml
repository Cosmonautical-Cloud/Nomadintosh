---
- name: Set paths for {{ release_archive.name }}
  ansible.builtin.set_fact:
    release_archives_version_dir: "{{ release_archive.dest }}/{{ release_archive.version }}"
    release_archives_marker: "{{ release_archive.dest }}/{{ release_archive.version }}/.release_archives_complete"
    release_archives_owner: "{{ release_archive.owner | default(ansible_user) }}"
    # Hidden and outside the version directory, so neither `current` nor
    # pruning ever sees it.
    release_archives_download: "{{ release_archive.dest }}/.{{ release_archive.version }}-{{ release_archive.url | basename }}"

- name: Create version directory for {{ release_archive.name }}
  become: true
  ansible.builtin.file:
    path: "{{ release_archives_version_dir }}"
    state: directory
    owner: "{{ release_archives_owner }}"
    group: staff
    mode: '0755'

# The marker (written only after a successful unpack) is what makes this
# idempotent - a half-unpacked directory from an interrupted run gets
# unpacked again rather than treated as installed.
- name: Check unpack marker for {{ release_archive.name }}
  ansible.builtin.stat:
    path: "{{ release_archives_marker }}"
  register: release_archives_marker_stat

# Not ansible.builtin.unarchive: it insists on GNU tar for tarballs, and
# macOS ships bsdtar (libarchive), which unpacks zips and tarballs alike.
- name: Download and unpack {{ release_archive.name }}
  when: not release_archives_marker_stat.stat.exists
  become: true
  become_user: "{{ release_archives_owner }}"
  block:
    - name: Download {{ release_archive.name }}
      ansible.builtin.get_url:
        url: "{{ release_archive.url }}"
        dest: "{{ release_archives_download }}"
        mode: '0644'

    - name: Unpack {{ release_archive.name }}
      ansible.builtin.command:
        argv: [tar, -xf, "{{ release_archives_download }}", -C, "{{ release_archives_version_dir }}"]
      changed_when: true

    - name: Remove download of {{ release_archive.name }}
      ansible.builtin.file:
        path: "{{ release_archives_download }}"
        state: absent

- name: Write unpack marker for {{ release_archive.name }}
  when: not release_archives_marker_stat.stat.exists
  ansible.builtin.copy:
    dest: "{{ release_archives_marker }}"
    content: "{{ release_archive.url }}\n"
    owner: "{{ release_archives_owner }}"
    mode: '0644'
  become: true

# Most archives wrap everything in one top-level directory (maestro.zip
# unpacks to maestro/{bin,lib}). When that's the case, `current` points into
# it, so <dest>/current/bin is the same path for every archive.
- name: Find top-level entries for {{ release_archive.name }}
  ansible.builtin.find:
    paths: "{{ release_archives_version_dir }}"
    file_type: any
    hidden: false
  register: release_archives_entries

- name: Point the current symlink for {{ release_archive.name }}
  become: true
  ansible.builtin.file:
    src: >-
      {{ release_archives_entries.files[0].path
         if (release_archives_entries.files | length == 1 and release_archives_entries.files[0].isdir)
         else release_archives_version_dir }}
    dest: "{{ release_archive.dest }}/current"
    state: link
    force: true

# <dest> belongs to this archive, so other version directories are leftovers
# from earlier pins.
- name: Find previous versions of {{ release_archive.name }}
  ansible.builtin.find:
    paths: "{{ release_archive.dest }}"
    file_type: directory
    excludes:
      - "{{ release_archive.version }}"
  register: release_archives_old
  when: release_archive.prune | default(true)

- name: Remove previous versions of {{ release_archive.name }}
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ release_archives_old.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: release_archive.prune | default(true)
