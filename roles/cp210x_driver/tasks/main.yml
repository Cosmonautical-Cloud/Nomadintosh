---
# Only hosts that need the driver get it: one with a supported stick plugged
# in that has no serial port yet. A host that already has the app keeps it
# up to date and active, even with the stick unplugged.
- name: Detect USB devices the CP210x driver supports
  ansible.builtin.script:
    cmd: "detect_devices.py {{ cp210x_driver_usb_ids | join(',') }}"
    executable: /usr/bin/python3
  register: cp210x_driver_detect
  changed_when: false
  check_mode: false

- name: Read the installed CP210x driver app's version
  ansible.builtin.command:
    argv:
      - /usr/bin/defaults
      - read
      - "{{ cp210x_driver_app }}/Contents/Info"
      - CFBundleShortVersionString
  register: cp210x_driver_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Decide whether this host needs the CP210x driver
  ansible.builtin.set_fact:
    cp210x_driver_devices_found: "{{ cp210x_driver_detect.stdout | from_json }}"
    cp210x_driver_needed: >-
      {{ (cp210x_driver_detect.stdout | from_json | rejectattr('serial') | list | length > 0)
         or cp210x_driver_installed.rc == 0 }}

- name: Skip the CP210x driver
  when: not cp210x_driver_needed
  ansible.builtin.debug:
    msg: >-
      Not installing the CP210x driver:
      {{ 'no supported USB device is plugged in'
         if cp210x_driver_devices_found | length == 0
         else (cp210x_driver_devices_found | map(attribute='name') | join(', '))
              ~ ' already has a serial port' }}.

- name: Install and activate the CP210x driver
  when: cp210x_driver_needed
  ansible.builtin.include_tasks: install.yml
