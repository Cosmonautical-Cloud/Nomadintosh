---
- name: Manage NFS mount watchdog
  when: nfs_mounts_shares | length > 0
  become: true
  block:
    - name: Require nas_host when NFS shares are configured
      ansible.builtin.assert:
        that:
          - nas_host is defined
          - nas_host | string | length > 0
        fail_msg: >-
          nfs_mounts_shares is set for {{ inventory_hostname }} but nas_host
          isn't - set it to your NAS's address in your own inventory
          (group_vars/host_vars) or as an extra var. This collection
          deliberately ships no default for it.
        quiet: true

    - name: Deploy NFS mount watchdog script
      ansible.builtin.template:
        src: nfs-mount-watchdog.sh.j2
        dest: "{{ config_dir }}/{{ nfs_mounts_watchdog_script_name }}"
        mode: '0755'
        owner: root
        group: wheel

    - name: Create LaunchDaemon for NFS mount watchdog
      ansible.builtin.template:
        src: LaunchDaemons/cloud.cosmonautical.nfs-mount-watchdog.plist.j2
        dest: "{{ launch_daemons_dir }}/{{ nfs_mounts_watchdog_label }}.plist"
        mode: '0644'
        owner: root
        group: wheel
      register: nfs_mounts_watchdog_launchdaemon

    - name: Reload NFS mount watchdog LaunchDaemon
      when: nfs_mounts_watchdog_launchdaemon.changed
      block:
        - name: Unload existing NFS mount watchdog LaunchDaemon (if loaded)
          ansible.builtin.command:
            argv:
              - launchctl
              - bootout
              - "system/{{ nfs_mounts_watchdog_label }}"
          failed_when: false
          changed_when: false

        - name: Load NFS mount watchdog LaunchDaemon
          ansible.builtin.command:
            argv:
              - launchctl
              - bootstrap
              - system
              - "{{ launch_daemons_dir }}/{{ nfs_mounts_watchdog_label }}.plist"
          changed_when: true
