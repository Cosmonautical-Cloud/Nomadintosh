---
- name: Check whether Homebrew is installed
  ansible.builtin.stat:
    path: "{{ homebrew_dir }}/bin/brew"
  register: homebrew_trust_brew

# brew trust prints "Trusted tap: x" on a new entry and "Already trusted tap: x"
# when the entry is already in ~/.homebrew/trust.json - the only idempotency
# signal it gives. Trusting a tap doesn't require it to be tapped yet, so this
# can run before the taps themselves are added.
- name: Trust third-party Homebrew taps
  ansible.builtin.command:
    argv:
      - "{{ homebrew_dir }}/bin/brew"
      - trust
      - --tap
      - "{{ item.name | default(item) }}"
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  loop: "{{ homebrew_trust_taps }}"
  register: homebrew_trust_result
  changed_when: homebrew_trust_result.stdout is match('Trusted ')
  when: homebrew_trust_brew.stat.exists
