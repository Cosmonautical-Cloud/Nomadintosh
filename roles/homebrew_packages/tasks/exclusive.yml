---
# An exclusive entry removes every other version of the same formula - the
# unversioned one from homebrew/core or its own tap, and any other @version
# from either - before it's installed. For formulae whose versions all link
# the same binary (e.g. oven-sh/bun/bun@<version> -> bin/bun), a leftover
# version makes the pinned one fail to link. Not the default because keg-only
# versioned formulae (openjdk@17 next to openjdk@21) coexist legitimately.
- name: Check whether Homebrew is installed
  ansible.builtin.stat:
    path: "{{ homebrew_dir }}/bin/brew"
  register: homebrew_packages_brew

- name: Remove other versions of exclusive formulae
  when: homebrew_packages_brew.stat.exists
  block:
    - name: List installed Homebrew formulae
      ansible.builtin.command:
        argv:
          - "{{ homebrew_dir }}/bin/brew"
          - list
          - --formula
          - --full-name
      environment:
        HOMEBREW_NO_AUTO_UPDATE: "1"
      register: homebrew_packages_installed
      changed_when: false
      check_mode: false

    - name: Uninstall conflicting formula versions
      community.general.homebrew:
        name: "{{ homebrew_packages_conflicts }}"
        state: absent
      vars:
        homebrew_packages_conflicts: |-
          {% set out = [] %}
          {% for p in homebrew_packages_resolved | selectattr('exclusive', 'defined') | selectattr('exclusive') %}
          {%   set parts = p.name.split('/') %}
          {%   set base = parts[-1].split('@')[0] %}
          {%   set tap = (parts[:2] | join('/')) if parts | length == 3 else '' %}
          {%   set pattern = '^(' ~ ((tap | regex_escape) ~ '/' if tap else '') ~ ')?' ~ (base | regex_escape) ~ '(@[^/]+)?$' %}
          {%   for f in homebrew_packages_installed.stdout_lines if f is match(pattern) and f != p.name %}
          {%     set _ = out.append(f) %}
          {%   endfor %}
          {% endfor %}
          {{ out | unique }}
      when: homebrew_packages_conflicts | length > 0
