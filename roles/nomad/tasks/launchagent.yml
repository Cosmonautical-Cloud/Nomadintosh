---
- name: Create Launch Agent for Nomad
  ansible.builtin.template:
    src: LaunchAgents/homebrew.mxcl.nomad.plist.j2
    dest: "{{ launch_agents_dir }}/{{ nomad_launchagent_label }}.plist"
    mode: '0644'
    owner: "{{ ansible_user }}"
    group: staff

- name: Start Nomad (if not already running)
  block:
    - name: Check if Nomad is already running
      ansible.builtin.command:
        argv:
          - launchctl
          - list
          - "{{ nomad_launchagent_label }}"
      register: nomad_launchctl
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Load Nomad Launch Agent
      when: nomad_launchctl.rc != 0
      ansible.builtin.command:
        argv:
          - launchctl
          - bootstrap
          - gui/{{ ansible_user_uid }}
          - "{{ launch_agents_dir }}/{{ nomad_launchagent_label }}.plist"
      changed_when: true

    # Nomad is already running - loading the LaunchAgent above only ever
    # happens once, so a later config or binary change needs an explicit
    # restart to actually take effect (e.g. a driver plugin enabled/disabled
    # via container.enabled/podman.enabled/docker.enabled no longer applies
    # until Nomad re-reads server.hcl). Restarts roll one host at a time,
    # waiting for each agent and the server cluster to report healthy before
    # moving on, so a run that changes every server never takes more than one
    # of them out of quorum.
    - name: Record whether Nomad needs a restart on this host
      ansible.builtin.set_fact:
        nomad_restart_needed: "{{ nomad_launchctl.rc == 0 and (nomad_server_config.changed or nomad_package_updated | default(false)) }}"

- name: Roll Nomad restarts across hosts
  any_errors_fatal: true
  block:
    - name: Restart Nomad one host at a time
      ansible.builtin.include_tasks: rolling_restart.yml
      loop: >-
        {{ ansible_play_hosts | map('extract', hostvars)
           | selectattr('nomad_restart_needed', 'defined') | selectattr('nomad_restart_needed')
           | map(attribute='inventory_hostname') | list }}
      loop_control:
        loop_var: nomad_restart_host
      when: inventory_hostname == ansible_play_hosts[0]
