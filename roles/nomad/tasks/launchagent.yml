---
- name: Create Launch Agent for Nomad
  ansible.builtin.template:
    src: LaunchAgents/homebrew.mxcl.nomad.plist.j2
    dest: "{{ launch_agents_dir }}/{{ nomad_launchagent_label }}.plist"
    mode: '0644'
    owner: "{{ ansible_user }}"
    group: staff

- name: Start Nomad (if not already running)
  block:
    - name: Check if Nomad is already running
      ansible.builtin.command:
        argv:
          - launchctl
          - list
          - "{{ nomad_launchagent_label }}"
      register: nomad_launchctl
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Load Nomad Launch Agent
      when: nomad_launchctl.rc != 0
      ansible.builtin.command:
        argv:
          - launchctl
          - bootstrap
          - gui/{{ ansible_user_uid }}
          - "{{ launch_agents_dir }}/{{ nomad_launchagent_label }}.plist"
      changed_when: true

    # Nomad is already running - loading the LaunchAgent above only ever
    # happens once, so a later config or binary change needs an explicit
    # restart to actually take effect (e.g. a driver plugin enabled/disabled
    # via container.enabled/podman.enabled/docker.enabled no longer applies
    # until Nomad re-reads server.hcl).
    - name: Restart Nomad (config or package changed)
      when:
        - nomad_launchctl.rc == 0
        - nomad_server_config.changed or nomad_package_updated | default(false)
      ansible.builtin.command:
        argv:
          - launchctl
          - kickstart
          - -k
          - "gui/{{ ansible_user_uid }}/{{ nomad_launchagent_label }}"
      changed_when: true
