---
# Loaded automatically for every play in this playbooks/ directory,
# regardless of what inventory source is used to run them (Ansible loads
# group_vars/host_vars relative to both the inventory source AND the
# playbook directory) - unlike inventory/group_vars, this survives Semaphore
# supplying its own inventory instead of inventory/hosts.yml.
# Homebrew's own default prefix for the host's CPU: /opt/homebrew on Apple
# silicon, /usr/local on Intel. geerlingguy.mac.homebrew (run by
# cosmonautical.macible.homebrew_packages) picks its install location the
# same way, so the two always agree. Override per host only if Homebrew was
# installed somewhere non-standard.
homebrew_dir: "{{ (ansible_facts['machine'] == 'arm64') | ternary('/opt/homebrew', '/usr/local') }}"

# Macible's php_extensions role has its own prefix variable.
php_extensions_homebrew_prefix: "{{ homebrew_dir }}"

# Every host gets hashicorp/tap - Consul and Nomad come from it.
# (cosmonautical.macible.homebrew_packages defaults this to [].)
homebrew_packages_base_taps:
  - hashicorp/tap

log_dir: "{{ homebrew_dir }}/var/log"

config_dir: /etc

working_dir: /opt

launch_agents_dir: "/Users/{{ ansible_user }}/Library/LaunchAgents"

launch_daemons_dir: /Library/LaunchDaemons

# nas_host (the NFS server's address) is deliberately NOT defaulted here -
# it's site-specific, so it has to come from the user's own inventory
# (group_vars/host_vars) or extra vars. The nfs_mounts role fails up front if
# a host has nfs_mounts_shares but no nas_host.
nas_user: "{{ ansible_user }}"
