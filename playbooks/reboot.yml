---
- name: Discover host OS family
  hosts: all
  gather_facts: true
  tasks:
    - name: Group hosts by OS family
      ansible.builtin.group_by:
        key: "os_{{ ansible_facts['os_family'] }}"

- name: Reboot Node
  hosts: os_Darwin
  gather_facts: false
  serial: 1
  become: true
  tasks:
    - name: Reboot Node
      ansible.builtin.include_role:
        name: cosmonautical.macible.reboot
