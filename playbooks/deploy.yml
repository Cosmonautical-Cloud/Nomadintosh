---
- name: Discover host OS family
  hosts: all
  gather_facts: true
  tasks:
    - name: Group hosts by OS family
      ansible.builtin.group_by:
        key: "os_{{ ansible_facts['os_family'] }}"
      # Without this, any --tags run skips discovery and the deployment play
      # below matches no hosts.
      tags:
        - always

- name: Perform Nomadintosh deployment
  hosts: os_Darwin
  # Facts already gathered in the discovery play above.
  gather_facts: false
  tasks:
    # Resolves the Nomad and Consul datacenters from DNS (and fails early on
    # hosts that aren't listed by FQDN). Tagged always because the consul
    # and nomad roles' templates read these facts.
    - name: Resolve datacenters
      ansible.builtin.include_role:
        name: set_facts
        apply:
          tags:
            - always
      tags:
        - always

    - name: Perform Software Update
      ansible.builtin.include_role:
        name: cosmonautical.macible.software_update
        apply:
          tags:
            - software_update
      tags:
        - software_update

    - name: Apply sysctl tuning
      ansible.builtin.include_role:
        name: sysctl
        apply:
          tags:
            - sysctl
      tags:
        - sysctl

    - name: Mount NFS shares
      ansible.builtin.include_role:
        name: cosmonautical.macible.nfs_mounts
        apply:
          tags:
            - nfs_mounts
      # Runs for every host - the role itself is a no-op unless the host has
      # a non-empty nfs_mounts_shares, so which hosts mount what is purely
      # an inventory decision, not tied to any particular group name.
      tags:
        - nfs_mounts

    - name: Install Homebrew and packages
      ansible.builtin.include_role:
        name: cosmonautical.macible.homebrew_packages
        apply:
          tags:
            - homebrew
      tags:
        - homebrew

    - name: Include Container role
      ansible.builtin.include_role:
        name: cosmonautical.macible.container
        apply:
          tags:
            - container
      # container.enabled: false (not just absent) actively tears down an
      # existing install - see roles/container/README.md.
      when: container.enabled is defined
      tags:
        - container

    - name: Include Docker Desktop role
      ansible.builtin.include_role:
        name: cosmonautical.macible.docker_desktop
        apply:
          tags:
            - docker
            - container-runtime
      # docker.enabled: false (not just absent) actively tears down an
      # existing install - see roles/docker_desktop/README.md.
      when: docker.enabled is defined
      tags:
        - docker
        - container-runtime

    - name: Include Podman role
      ansible.builtin.include_role:
        name: cosmonautical.macible.podman
        apply:
          tags:
            - podman
            - container-runtime
      # podman.enabled: false (not just absent) actively tears down an
      # existing install - see roles/podman/README.md.
      when: podman.enabled is defined
      tags:
        - podman
        - container-runtime

    - name: Include release archives role
      ansible.builtin.include_role:
        name: cosmonautical.macible.release_archives
        apply:
          tags:
            - release_archives
      tags:
        - release_archives

    - name: Include Android SDK role
      ansible.builtin.include_role:
        name: cosmonautical.macible.android_sdk
        apply:
          tags:
            - android_sdk
      when: android_sdk.enabled | default(false)
      tags:
        - android_sdk

    # Magic group: membership alone turns this on - see README.md#magic-groups.
    # After homebrew_packages, since the App Store install needs mas from
    # Homebrew.
    - name: Include Xcode role
      ansible.builtin.include_role:
        name: cosmonautical.macible.xcode
        apply:
          tags:
            - xcode
      when: "'github_runners' in group_names"
      tags:
        - xcode

    - name: Include Seaweedfs role
      ansible.builtin.include_role:
        name: seaweedfs
        apply:
          tags:
            - seaweedfs
      when: seaweedfs.master.enabled | default(false) or seaweedfs.volume.enabled | default(false)
      tags:
        - seaweedfs

    - name: Include Consul role
      ansible.builtin.include_role:
        name: consul
        apply:
          tags:
            - consul
      tags:
        - consul

    - name: Include Nomad role
      ansible.builtin.include_role:
        name: nomad
        apply:
          tags:
            - nomad
      tags:
        - nomad
