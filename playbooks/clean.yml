---
- name: Discover host OS family
  hosts: all
  gather_facts: true
  tasks:
    - name: Group hosts by OS family
      ansible.builtin.group_by:
        key: "os_{{ ansible_facts['os_family'] }}"

- name: Clean up stale Homebrew residue
  hosts: os_Darwin
  gather_facts: false
  tasks:
    - name: Run brew cleanup
      ansible.builtin.include_role:
        name: clean
